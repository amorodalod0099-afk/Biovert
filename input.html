<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Data Setoran — Biovert by CYCLO</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet"></head><body data-page="input"><div id="app-header"></div><main class="container page"><div class="page-title"><div><span class="eyebrow">Internal CYCLO</span><h1>Input Data Setoran</h1><p>Data yang disimpan akan memperbarui dashboard dan leaderboard.</p></div><button class="btn outline" id="logout">Keluar</button></div><form id="deposit-form" class="panel form-grid"><label>Pedagang<select name="partner" id="partner" required></select></label><label>Tanggal Setoran<input name="date" type="date" required></label><label>Berat Sampah (kg)<input name="kg" type="number" min="0.1" step="0.1" required></label><label>Kerapian Pemilahan<select name="quality"><option value="1.5">Rapi ×1,5</option><option value="1">Cukup Rapi ×1</option><option value="0.5">Kurang Rapi ×0,5</option></select></label><label class="full">Catatan<textarea name="note" rows="3"></textarea></label><button class="btn primary" type="submit">Simpan Setoran</button><p class="form-message" id="deposit-message"></p></form><section class="panel table-wrap"><div class="panel-head"><h2>Riwayat Setoran</h2><span class="caption">Dapat diedit atau dihapus</span></div><table><thead><tr><th>Tanggal</th><th>Pedagang</th><th>Berat</th><th>Poin</th><th>Aksi</th></tr></thead><tbody id="deposit-history"></tbody></table></section></main><div id="app-footer"></div><script src="app.js"></script></body></html>
